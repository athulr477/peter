<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d111a">
  <meta name="format-detection" content="telephone=no">
  <title>Beach Penalty Shootout</title>
  <meta name="description" content="Realistic beach soccer penalty shootout game. Swipe to score goals past the keeper!">
  <meta name="application-name" content="Beach Penalty">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="gameContainer" class="game-container">
    <!-- Main 2D Canvas: 100% visible net, keeper, beach, ball -->
    <canvas id="gameCanvas"></canvas>

    <!-- Shot Result Popup Banner (momentarily displays GOAL!, SAVED!, etc.) -->
    <div id="resultBanner" class="result-banner hidden">
      <span id="resultText" class="result-text">⚽ GOAL!</span>
    </div>

    <!-- Game Over Modal with Working RESTART Button -->
    <div id="gameOverModal" class="modal-backdrop hidden">
      <div class="modal-card game-over-card">
        <div id="gameOverIcon" class="summary-trophy">🏆</div>
        <h2 id="gameOverTitle" class="modal-title">ROUND FINISHED</h2>
        <div class="summary-score-box">
          <span class="score-caption">GOALS SCORED</span>
          <span id="gameOverScoreText" class="final-score">0 / 5</span>
        </div>
        <p id="gameOverRating" class="summary-rating">BEACH LEGEND!</p>
        <button id="gameOverRestartBtn" class="btn btn-primary btn-large restart-main-btn" aria-label="Restart Game">
          <span class="btn-icon">🔄</span> RESTART
        </button>
      </div>
    </div>

    <!-- Asset Preloader Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loader-content">
        <div class="ball-spin-icon">⚽</div>
        <h2 class="loader-title">BEACH PENALTY SHOOTOUT</h2>
        <p class="loader-sub">Preparing coastal stadium & goalkeeper...</p>
        <div class="loader-track">
          <div id="loadingBar" class="loader-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
